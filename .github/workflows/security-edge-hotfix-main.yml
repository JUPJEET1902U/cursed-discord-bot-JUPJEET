name: One-time Security Edge Hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/security-edge-hotfix-main.yml"

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Apply reviewed security edge fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:90]!r}")
              p.write_text(text.replace(old, new, 1))

          protection = "utils/securityProtection.js"
          response = "utils/securityResponse.js"
          listeners = "utils/securityRecoveryListeners.js"
          tests = "test/security-resilience-hardening.test.js"

          # 1) Audit attribution must stay anchored to the gateway observation time.
          replace_once(
              protection,
              'const MAX_COORDINATED_WINDOW_MS = 60_000\n',
              'const MAX_COORDINATED_WINDOW_MS = 60_000\nconst HYDRATION_FAILED = Symbol("hydration-failed")\nconst HYDRATION_FAILURE_RETRY_MS = 5000\n'
          )
          replace_once(
              protection,
              '    const upperBound = now() + maxFutureMs\n',
              '    const upperBound = observedAt + maxFutureMs\n'
          )

          # 2) Failed Mongo hydration must retry quickly instead of being cached for 60 seconds.
          replace_once(
              protection,
              '        const persisted = await loadExecutorSecurityWindow(guildId, executorId, retentionMs).catch(() => null)\n'
              '        const merged = mergeActionHistory(local, persisted || [], retentionMs, currentTime)\n'
              '        executorActionWindows.set(key, merged)\n'
              '        executorHydratedAt.set(key, currentTime)\n',
              '        const persisted = await loadExecutorSecurityWindow(guildId, executorId, retentionMs).catch(() => HYDRATION_FAILED)\n'
              '        const persistedHistory = persisted === HYDRATION_FAILED ? [] : (persisted || [])\n'
              '        const merged = mergeActionHistory(local, persistedHistory, retentionMs, currentTime)\n'
              '        executorActionWindows.set(key, merged)\n'
              '        executorHydratedAt.set(\n'
              '            key,\n'
              '            persisted === HYDRATION_FAILED\n'
              '                ? currentTime - (60_000 - HYDRATION_FAILURE_RETRY_MS)\n'
              '                : currentTime\n'
              '        )\n'
          )
          replace_once(
              protection,
              '        const persisted = await loadGuildSecurityWindow(guildId, windowMs).catch(() => null)\n'
              '        const merged = mergeGuildActionHistory(local, persisted || [], windowMs, currentTime)\n'
              '        guildActionWindows.set(guildId, merged)\n'
              '        guildHydratedAt.set(guildId, currentTime)\n',
              '        const persisted = await loadGuildSecurityWindow(guildId, windowMs).catch(() => HYDRATION_FAILED)\n'
              '        const persistedHistory = persisted === HYDRATION_FAILED ? [] : (persisted || [])\n'
              '        const merged = mergeGuildActionHistory(local, persistedHistory, windowMs, currentTime)\n'
              '        guildActionWindows.set(guildId, merged)\n'
              '        guildHydratedAt.set(\n'
              '            guildId,\n'
              '            persisted === HYDRATION_FAILED\n'
              '                ? currentTime - (60_000 - HYDRATION_FAILURE_RETRY_MS)\n'
              '                : currentTime\n'
              '        )\n'
          )
          replace_once(
              protection,
              '        const persisted = await loadRaidWindow(guildId, windowMs).catch(() => null)\n'
              '        const merged = mergeRaidRecords(joinWindows.get(guildId) || [], persisted?.events || [], windowMs, currentTime)\n'
              '        joinWindows.set(guildId, merged)\n'
              '        if (persisted?.activeUntil > currentTime) activeRaids.set(guildId, persisted.activeUntil)\n'
              '        raidHydratedAt.set(guildId, currentTime)\n',
              '        const persisted = await loadRaidWindow(guildId, windowMs).catch(() => HYDRATION_FAILED)\n'
              '        const persistedEvents = persisted === HYDRATION_FAILED ? [] : (persisted?.events || [])\n'
              '        const merged = mergeRaidRecords(joinWindows.get(guildId) || [], persistedEvents, windowMs, currentTime)\n'
              '        joinWindows.set(guildId, merged)\n'
              '        if (persisted !== HYDRATION_FAILED && persisted?.activeUntil > currentTime) activeRaids.set(guildId, persisted.activeUntil)\n'
              '        raidHydratedAt.set(\n'
              '            guildId,\n'
              '            persisted === HYDRATION_FAILED\n'
              '                ? currentTime - (60_000 - HYDRATION_FAILURE_RETRY_MS)\n'
              '                : currentTime\n'
              '        )\n'
          )

          # 3) Reuse neutralization only for the exact same successful policy.
          replace_once(
              response,
              'const RECOVERY_MAPPING_TTL_MS = 10 * 60_000\n',
              'const RECOVERY_MAPPING_TTL_MS = 10 * 60_000\nconst RECOVERY_DEPENDENCY_GRACE_MS = 750\n'
          )
          replace_once(
              response,
              'function neutralizationKey(guild, member) {\n'
              '    return `${guild.id}:${member.id}`\n'
              '}\n',
              'function neutralizationKey(guild, member) {\n'
              '    return `${guild.id}:${member.id}`\n'
              '}\n\n'
              'function neutralizationPolicyKey(config) {\n'
              '    const timeoutMinutes = Math.max(1, Math.min(40320, Number(config?.antiNuke?.neutralizeTimeoutMinutes) || 10080))\n'
              '    return JSON.stringify({\n'
              '        removeDangerousRoles: config?.antiNuke?.removeDangerousRoles !== false,\n'
              '        banMaliciousBots: config?.antiNuke?.banMaliciousBots !== false,\n'
              '        timeoutMinutes,\n'
              '        autoLockdown: config?.antiNuke?.autoLockdown === true,\n'
              '        lockdownEnabled: config?.lockdown?.enabled !== false,\n'
              '    })\n'
              '}\n'
          )
          old_neutralize = '''async function neutralizeExecutor(guild, member, config, options = {}) {
              if (!guild || !member) return neutralizeExecutorInternal(guild, member, config, options)
              const key = neutralizationKey(guild, member)
              const currentTime = Date.now()
              const recent = recentNeutralizations.get(key)
              if (recent?.result?.ok && currentTime - recent.at < NEUTRALIZATION_REUSE_MS) {
                  return { ...recent.result, reused: true }
              }
              if (neutralizationFlights.has(key)) return neutralizationFlights.get(key)

              const flight = neutralizeExecutorInternal(guild, member, config, options)
                  .then(result => {
                      if (result.ok) recentNeutralizations.set(key, { at: Date.now(), result })
                      pruneStateMap(recentNeutralizations, NEUTRALIZATION_REUSE_MS, Date.now(), 3000)
                      return result
                  })
                  .finally(() => neutralizationFlights.delete(key))
              neutralizationFlights.set(key, flight)
              return flight
          }'''.replace('\n              ', '\n')
          new_neutralize = '''async function neutralizeExecutor(guild, member, config, options = {}) {
              if (!guild || !member) return neutralizeExecutorInternal(guild, member, config, options)
              const key = neutralizationKey(guild, member)
              const policyKey = neutralizationPolicyKey(config)
              const currentTime = Date.now()
              const recent = recentNeutralizations.get(key)
              if (
                  recent?.result?.ok
                  && !recent.result.errors?.length
                  && recent.policyKey === policyKey
                  && currentTime - recent.at < NEUTRALIZATION_REUSE_MS
              ) {
                  return { ...recent.result, reused: true }
              }

              const existing = neutralizationFlights.get(key)
              if (existing) {
                  const existingResult = await existing.promise
                  if (existing.policyKey === policyKey) return existingResult
              }

              const holder = { policyKey, promise: null }
              const flight = neutralizeExecutorInternal(guild, member, config, options)
                  .then(result => {
                      if (result.ok && !result.errors?.length) {
                          recentNeutralizations.set(key, { at: Date.now(), result, policyKey })
                      }
                      pruneStateMap(recentNeutralizations, NEUTRALIZATION_REUSE_MS, Date.now(), 3000)
                      return result
                  })
                  .finally(() => {
                      if (neutralizationFlights.get(key) === holder) neutralizationFlights.delete(key)
                  })
              holder.promise = flight
              neutralizationFlights.set(key, holder)
              return flight
          }'''.replace('\n              ', '\n')
          replace_once(response, old_neutralize, new_neutralize)

          # 4) Briefly wait for late parent/role recovery registration during a mass delete.
          old_wait = '''async function waitForRecoveryDependencies(guild, channel) {
              const dependencies = []
              if (channel.parentId && !guild.channels.cache.has(channel.parentId)) {
                  const parentFlight = recoveryFlights.get(recoveryKey("channel", guild.id, channel.parentId))
                  if (parentFlight) dependencies.push(parentFlight)
              }
              if (channel.permissionOverwrites?.cache) {
                  for (const overwrite of channel.permissionOverwrites.cache.values()) {
                      if (Number(overwrite.type) !== 0 || guild.roles.cache.has(overwrite.id)) continue
                      const roleFlight = recoveryFlights.get(recoveryKey("role", guild.id, overwrite.id))
                      if (roleFlight) dependencies.push(roleFlight)
                  }
              }
              if (dependencies.length) await Promise.allSettled(dependencies)
          }'''.replace('\n              ', '\n')
          new_wait = '''async function waitForRecoveryDependency(kind, guild, originalId) {
              const deadline = Date.now() + RECOVERY_DEPENDENCY_GRACE_MS
              const key = recoveryKey(kind, guild.id, originalId)
              while (Date.now() <= deadline) {
                  const mapped = kind === "role"
                      ? recoveredId(recoveredRoleIds, guild.id, originalId)
                      : recoveredId(recoveredChannelIds, guild.id, originalId)
                  if (mapped) return true
                  const flight = recoveryFlights.get(key)
                  if (flight) {
                      await Promise.allSettled([flight])
                      return true
                  }
                  await new Promise(resolve => setTimeout(resolve, 25))
              }
              return false
          }

          async function waitForRecoveryDependencies(guild, channel) {
              const dependencies = []
              if (
                  channel.parentId
                  && !guild.channels.cache.has(channel.parentId)
                  && !recoveredId(recoveredChannelIds, guild.id, channel.parentId)
              ) {
                  dependencies.push(waitForRecoveryDependency("channel", guild, channel.parentId))
              }
              if (channel.permissionOverwrites?.cache) {
                  for (const overwrite of channel.permissionOverwrites.cache.values()) {
                      if (Number(overwrite.type) !== 0 || guild.roles.cache.has(overwrite.id)) continue
                      if (recoveredId(recoveredRoleIds, guild.id, overwrite.id)) continue
                      dependencies.push(waitForRecoveryDependency("role", guild, overwrite.id))
                  }
              }
              if (dependencies.length) await Promise.allSettled(dependencies)
          }'''.replace('\n              ', '\n')
          replace_once(response, old_wait, new_wait)

          # 5) Tamper protection should cover roles carrying CURSED's critical security permissions, not decorative roles.
          replace_once(
              listeners,
              'const {\n    AuditLogEvent,\n    Events,\n} = require("discord.js")\n',
              'const {\n    AuditLogEvent,\n    Events,\n    PermissionFlagsBits,\n} = require("discord.js")\n'
          )
          replace_once(
              listeners,
              'const ROLE_RECOVERY_EXPECTATION_TTL_MS = 10_000\n',
              'const ROLE_RECOVERY_EXPECTATION_TTL_MS = 10_000\n'
              'const BOT_PROTECTION_PERMISSIONS = Object.freeze([\n'
              '    PermissionFlagsBits.ViewAuditLog,\n'
              '    PermissionFlagsBits.ManageRoles,\n'
              '    PermissionFlagsBits.ManageChannels,\n'
              '    PermissionFlagsBits.ManageWebhooks,\n'
              '    PermissionFlagsBits.ModerateMembers,\n'
              '    PermissionFlagsBits.KickMembers,\n'
              '    PermissionFlagsBits.BanMembers,\n'
              '])\n'
          )
          replace_once(
              listeners,
              'async function restoreRemovedBotRoles(oldMember, newMember) {\n'
              '    const removed = oldMember.roles.cache.filter(role => !newMember.roles.cache.has(role.id))\n'
              '    const restorable = [...removed.values()].filter(role => role.id !== newMember.guild.id && !role.managed && role.editable)\n',
              'function isBotProtectionRole(member, role) {\n'
              '    if (!member || !role || role.id === member.guild?.id || !member.roles?.cache?.has(role.id)) return false\n'
              '    return BOT_PROTECTION_PERMISSIONS.some(permission => role.permissions?.has(permission))\n'
              '}\n\n'
              'async function restoreRemovedBotRoles(oldMember, newMember, rolesToRestore = null) {\n'
              '    const removed = rolesToRestore || oldMember.roles.cache.filter(role => !newMember.roles.cache.has(role.id))\n'
              '    const restorable = [...removed.values()].filter(role => role.id !== newMember.guild.id && !role.managed && role.editable)\n'
          )
          replace_once(
              listeners,
              '        const botRoleProtected = config.tamperProtection.protectBotRole\n'
              '            && newRole.id !== guild.id\n'
              '            && me?.roles?.cache?.has(newRole.id) === true\n',
              '        const botRoleProtected = config.tamperProtection.protectBotRole\n'
              '            && (isBotProtectionRole(me, oldRole) || isBotProtectionRole(me, newRole))\n'
          )
          replace_once(
              listeners,
              '        const removed = oldMember.roles.cache.filter(role => !newMember.roles.cache.has(role.id))\n'
              '        if (!removed.size) return\n\n'
              '        const executor = await latestAuditExecutor(guild, AuditLogEvent.MemberRoleUpdate, newMember.id, observedAt)\n'
              '        if (await isTamperExecutorExempt(guild, executor)) return\n\n'
              '        const recovery = await restoreRemovedBotRoles(oldMember, newMember)\n'
              '        const restoredText = recovery.restoredRoleIds.length\n'
              '            ? ` Restored ${recovery.restoredRoleIds.length} manageable role(s).`\n'
              '            : ""\n'
              '        await recordTamper(\n'
              '            guild,\n'
              '            config,\n'
              '            "CURSED_ROLE_REMOVED",\n'
              '            `CURSED lost ${removed.size} role(s).${restoredText} Protection permissions may have been reduced.`,\n'
              '            executor,\n'
              '            { recovery }\n'
              '        )\n',
              '        const removed = oldMember.roles.cache.filter(role => !newMember.roles.cache.has(role.id))\n'
              '        const protectedRemoved = removed.filter(role => isBotProtectionRole(oldMember, role))\n'
              '        if (!protectedRemoved.size) return\n\n'
              '        const executor = await latestAuditExecutor(guild, AuditLogEvent.MemberRoleUpdate, newMember.id, observedAt)\n'
              '        if (await isTamperExecutorExempt(guild, executor)) return\n\n'
              '        const recovery = await restoreRemovedBotRoles(oldMember, newMember, protectedRemoved)\n'
              '        const restoredText = recovery.restoredRoleIds.length\n'
              '            ? ` Restored ${recovery.restoredRoleIds.length} critical protection role(s).`\n'
              '            : ""\n'
              '        await recordTamper(\n'
              '            guild,\n'
              '            config,\n'
              '            "CURSED_ROLE_REMOVED",\n'
              '            `CURSED lost ${protectedRemoved.size} critical protection role(s).${restoredText} Protection permissions may have been reduced.`,\n'
              '            executor,\n'
              '            { recovery }\n'
              '        )\n'
          )
          replace_once(
              listeners,
              '    restoreRemovedBotRoles,\n}\n',
              '    restoreRemovedBotRoles,\n    isBotProtectionRole,\n}\n'
          )

          # Regression tests for each missed edge case.
          p = Path(tests)
          text = p.read_text()
          marker = 'async function run() {\n'
          if text.count(marker) != 1:
              raise SystemExit("test insertion marker mismatch")
          extra = r'''
          async function testAuditFutureWindowDoesNotDriftDuringRetry() {
              const targetId = "future-window-target"
              const observedAt = Date.now()
              const future = makeAuditEntry("audit-future", targetId, "future-executor", observedAt + 2500)
              const guild = { fetchAuditLogs: async () => ({ entries: new Map([[future.id, future]]) }) }
              const found = await protection.fetchMatchingAuditEntry(guild, "CHANNEL_UPDATE", targetId, [1000], { observedAt })
              assert.equal(found, null, "retry delay must not expand the audit future window")
          }

          async function testDifferentNeutralizationPolicyIsNotReused() {
              let timeoutCalls = 0
              const member = {
                  id: "policy-member",
                  user: { bot: false },
                  manageable: true,
                  moderatable: true,
                  roles: { cache: new Map() },
                  timeout: async () => { timeoutCalls += 1 },
              }
              const guild = {
                  id: "policy-guild",
                  ownerId: "owner-id",
                  members: { me: { id: "cursed-id", permissions: { has: () => false } } },
              }
              const first = { antiNuke: { removeDangerousRoles: true, neutralizeTimeoutMinutes: 1, autoLockdown: false }, lockdown: { enabled: false } }
              const stronger = { antiNuke: { removeDangerousRoles: true, neutralizeTimeoutMinutes: 60, autoLockdown: false }, lockdown: { enabled: false } }
              await response.neutralizeExecutor(guild, member, first, { reason: "first policy" })
              await response.neutralizeExecutor(guild, member, stronger, { reason: "stronger policy" })
              assert.equal(timeoutCalls, 2, "a different neutralization policy must not reuse a previous result")
          }

          async function testLateRecoveryDependencyRegistration() {
              let capturedOptions = null
              const guild = {
                  id: "late-dependency-guild",
                  members: { me: { roles: { highest: { position: 20 } }, permissions: { has: p => p === PermissionFlagsBits.ManageChannels || p === PermissionFlagsBits.ManageRoles } } },
                  roles: { cache: new Map(), create: async () => ({ id: "late-restored-role", setPosition: async () => {} }) },
                  channels: { cache: new Map(), create: async options => { capturedOptions = options; return { id: "late-restored-channel", setPosition: async () => {} } } },
              }
              const oldRole = { id: "late-old-role", name: "Late Role", color: 0, hoist: false, permissions: { bitfield: PermissionFlagsBits.ManageChannels }, mentionable: false, unicodeEmoji: null, position: 5 }
              const oldChannel = {
                  id: "late-old-channel", name: "late-channel", type: ChannelType.GuildText, parentId: null, topic: null, nsfw: false, rateLimitPerUser: 0, rawPosition: 1,
                  permissionOverwrites: { cache: new Map([["late", { id: oldRole.id, type: 0, allow: { bitfield: 1n }, deny: { bitfield: 0n } }]]) },
              }
              const channelPromise = response.restoreDeletedChannel(guild, oldChannel, "late dependency channel")
              await new Promise(resolve => setTimeout(resolve, 75))
              const roleResult = await response.restoreDeletedRole(guild, oldRole, "late dependency role")
              const channelResult = await channelPromise
              assert.equal(roleResult.ok, true)
              assert.equal(channelResult.ok, true)
              assert.equal(capturedOptions.permissionOverwrites[0].id, roleResult.restoredId)
          }

          function testDecorativeBotRoleIsNotTamperProtected() {
              const guild = { id: "role-scope-guild" }
              const decorative = { id: "decorative-role", guild, permissions: permissionSet([]) }
              const critical = { id: "critical-role", guild, permissions: permissionSet([PermissionFlagsBits.ManageRoles]) }
              const member = { guild, roles: { cache: new Map([[decorative.id, decorative], [critical.id, critical]]) } }
              assert.equal(recoveryListeners.isBotProtectionRole(member, decorative), false)
              assert.equal(recoveryListeners.isBotProtectionRole(member, critical), true)
          }

          function testHydrationFailureShortRetryContract() {
              const source = require("node:fs").readFileSync(require("node:path").join(__dirname, "../utils/securityProtection.js"), "utf8")
              assert.match(source, /HYDRATION_FAILED = Symbol/)
              assert.match(source, /HYDRATION_FAILURE_RETRY_MS = 5000/)
              assert.match(source, /currentTime - \(60_000 - HYDRATION_FAILURE_RETRY_MS\)/)
          }

          '''.replace('\n          ', '\n')
          text = text.replace(marker, extra + marker, 1)
          old = '    await testStaleAuditEntriesAreRejected()\n    testMixedAndSlowBurnActionRisk()\n'
          new = '    await testStaleAuditEntriesAreRejected()\n    await testAuditFutureWindowDoesNotDriftDuringRetry()\n    testMixedAndSlowBurnActionRisk()\n'
          if text.count(old) != 1:
              raise SystemExit("test audit call insertion mismatch")
          text = text.replace(old, new, 1)
          old = '    await testNeutralizationSingleFlight()\n    await testRecoverySingleFlightAndRoleRemap()\n    testOnlyOneLiveAntiRaidJoinListener()\n'
          new = '    await testNeutralizationSingleFlight()\n    await testDifferentNeutralizationPolicyIsNotReused()\n    await testRecoverySingleFlightAndRoleRemap()\n    await testLateRecoveryDependencyRegistration()\n    testDecorativeBotRoleIsNotTamperProtected()\n    testHydrationFailureShortRetryContract()\n    testOnlyOneLiveAntiRaidJoinListener()\n'
          if text.count(old) != 1:
              raise SystemExit("test final call insertion mismatch")
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Validate changed-file syntax
        run: |
          node --check utils/securityProtection.js
          node --check utils/securityResponse.js
          node --check utils/securityRecoveryListeners.js
          node --check test/security-resilience-hardening.test.js

      - name: Run security regression suite
        run: |
          node test/moderation-hardening.test.js
          node test/security-owner-notification.test.js
          node test/security-recovery-suite.test.js
          node test/security-runtime-hardening.test.js
          node test/security-resilience-hardening.test.js
          node test/webhook-security.test.js
          npx tsx test/api-session-hardening.test.ts
          node test/api-security-typescript.test.js

      - name: Commit hotfix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils/securityProtection.js utils/securityResponse.js utils/securityRecoveryListeners.js test/security-resilience-hardening.test.js
          git diff --cached --check
          git commit -m "Fix security hardening edge cases"
          git push origin HEAD:main
